name: Build iOS IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild build \
            -project TennisPods.xcodeproj \
            -scheme TennisPods \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/TennisPods.app Payload/
          zip -r TennisPods.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TennisPods-IPA
          path: TennisPods.ipa
